<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Site Content Save Fix</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }
    .test-section {
      border: 1px solid #ddd;
      padding: 20px;
      margin: 20px 0;
      border-radius: 5px;
    }
    .test-section h2 {
      margin-top: 0;
    }
    .pass {
      color: green;
      font-weight: bold;
    }
    .fail {
      color: red;
      font-weight: bold;
    }
    pre {
      background: #f4f4f4;
      padding: 10px;
      border-radius: 3px;
      overflow-x: auto;
    }
    button {
      padding: 10px 20px;
      margin: 5px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Site Content Save Fix Test</h1>
  
  <div class="test-section">
    <h2>Test Setup</h2>
    <p>This test validates that the About Us and Sister Hotel save functionality correctly preserves data.</p>
    <button onclick="runTests()">Run All Tests</button>
  </div>

  <div class="test-section">
    <h2>Test Results</h2>
    <div id="testResults"></div>
  </div>

  <!-- Load dependencies -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="site-content-manager.js"></script>

  <script>
    function log(message, isPass = null) {
      const results = document.getElementById('testResults');
      const p = document.createElement('p');
      if (isPass === true) {
        p.className = 'pass';
        p.textContent = '✓ ' + message;
      } else if (isPass === false) {
        p.className = 'fail';
        p.textContent = '✗ ' + message;
      } else {
        p.textContent = message;
      }
      results.appendChild(p);
    }

    function logJson(label, data) {
      const results = document.getElementById('testResults');
      const pre = document.createElement('pre');
      pre.textContent = label + ':\n' + JSON.stringify(data, null, 2);
      results.appendChild(pre);
    }

    async function runTests() {
      const results = document.getElementById('testResults');
      results.innerHTML = '<p>Running tests...</p>';

      try {
        // Test 1: Verify SiteContentManager is loaded
        log('Test 1: Checking if SiteContentManager is loaded...');
        if (typeof SiteContentManager === 'undefined') {
          log('FAILED: SiteContentManager not loaded', false);
          return;
        }
        log('PASSED: SiteContentManager is loaded', true);

        // Test 2: Get initial content
        log('Test 2: Getting initial content...');
        const initialContent = await SiteContentManager.getAllContent();
        logJson('Initial content', initialContent);
        log('PASSED: Retrieved initial content', true);

        // Test 3: Simulate saving About Us while preserving Sister Hotel
        log('Test 3: Simulating About Us save (should preserve Sister Hotel)...');
        
        // Store original sister content
        const originalSister = {
          en: initialContent.en?.sister || {},
          nl: initialContent.nl?.sister || {},
          fr: initialContent.fr?.sister || {}
        };
        
        logJson('Original Sister Hotel content', originalSister);

        // Simulate the fixed save logic for About Us
        const aboutData = {
          en: { title: 'Test About Us EN', body: 'Test body EN' },
          nl: { title: 'Test Over Ons NL', body: 'Test inhoud NL' },
          fr: { title: 'Test À Propos FR', body: 'Test corps FR' }
        };

        const multilingualDataAbout = {};
        ['en', 'nl', 'fr'].forEach(lang => {
          const existingLang = initialContent[lang] || {};
          multilingualDataAbout[lang] = {
            about: aboutData[lang],
            sister: existingLang.sister || {}
          };
        });

        logJson('About Us save payload', multilingualDataAbout);

        // Verify sister content is preserved
        let sisterPreserved = true;
        ['en', 'nl', 'fr'].forEach(lang => {
          const originalKeys = Object.keys(originalSister[lang] || {});
          const newKeys = Object.keys(multilingualDataAbout[lang].sister || {});
          
          if (originalKeys.length > 0 && newKeys.length === 0) {
            log(`FAILED: Sister Hotel content lost for ${lang}`, false);
            sisterPreserved = false;
          }
        });

        if (sisterPreserved) {
          log('PASSED: Sister Hotel content preserved when saving About Us', true);
        }

        // Test 4: Simulate saving Sister Hotel while preserving About Us
        log('Test 4: Simulating Sister Hotel save (should preserve About Us)...');
        
        // Store original about content
        const originalAbout = {
          en: initialContent.en?.about || {},
          nl: initialContent.nl?.about || {},
          fr: initialContent.fr?.about || {}
        };
        
        logJson('Original About Us content', originalAbout);

        // Simulate the fixed save logic for Sister Hotel
        const sisterData = {
          en: { kicker: 'Test Kicker EN', titleLine1: 'Test Line1 EN', titleLine2: 'Test Line2 EN', body: 'Test body EN' },
          nl: { kicker: 'Test Kicker NL', titleLine1: 'Test Line1 NL', titleLine2: 'Test Line2 NL', body: 'Test body NL' },
          fr: { kicker: 'Test Kicker FR', titleLine1: 'Test Line1 FR', titleLine2: 'Test Line2 FR', body: 'Test body FR' }
        };

        const multilingualDataSister = {};
        ['en', 'nl', 'fr'].forEach(lang => {
          const existingLang = initialContent[lang] || {};
          multilingualDataSister[lang] = {
            about: existingLang.about || {},
            sister: sisterData[lang]
          };
        });

        logJson('Sister Hotel save payload', multilingualDataSister);

        // Verify about content is preserved
        let aboutPreserved = true;
        ['en', 'nl', 'fr'].forEach(lang => {
          const originalKeys = Object.keys(originalAbout[lang] || {});
          const newKeys = Object.keys(multilingualDataSister[lang].about || {});
          
          if (originalKeys.length > 0 && newKeys.length === 0) {
            log(`FAILED: About Us content lost for ${lang}`, false);
            aboutPreserved = false;
          }
        });

        if (aboutPreserved) {
          log('PASSED: About Us content preserved when saving Sister Hotel', true);
        }

        log('');
        log('All tests completed!');
        
      } catch (error) {
        log('ERROR: ' + error.message, false);
        console.error(error);
      }
    }

    // Auto-run tests on page load
    window.addEventListener('load', () => {
      log('Page loaded. Click "Run All Tests" to start testing.');
    });
  </script>
</body>
</html>
