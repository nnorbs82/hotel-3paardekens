<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Amenity Edit Functionality</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
      max-width: 1000px;
      margin: 0 auto;
    }
    .test-section {
      margin: 20px 0;
      padding: 20px;
      border: 1px solid #ddd;
      background: white;
      border-radius: 5px;
    }
    .pass { color: #0a0; font-weight: bold; }
    .fail { color: #a00; font-weight: bold; }
    .info { color: #06a; }
    h1 { color: #333; }
    h2 { color: #666; margin-top: 30px; }
    .amenity-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #e0e0e0;
      margin: 5px 0;
      border-radius: 3px;
    }
    .amenity-icon-preview {
      width: 24px;
      height: 24px;
    }
    .amenity-icon-preview svg {
      width: 100%;
      height: 100%;
      stroke: #333;
      fill: none;
      stroke-width: 2;
    }
    button {
      padding: 5px 10px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: white;
      border-radius: 3px;
    }
    button.edit { background: #4CAF50; color: white; border-color: #4CAF50; }
    button.delete { background: #f44336; color: white; border-color: #f44336; }
  </style>
</head>
<body>
  <h1>Amenity Edit Functionality Test</h1>
  <div id="testResults"></div>

  <!-- Load dependencies -->
  <script src="admin-room-manager.js"></script>

  <script>
    const testResults = document.getElementById('testResults');
    let testsPassed = 0;
    let testsFailed = 0;

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = type;
      div.innerHTML = message;
      testResults.appendChild(div);
    }

    function assert(condition, message) {
      if (condition) {
        log(`✓ PASS: ${message}`, 'pass');
        testsPassed++;
      } else {
        log(`✗ FAIL: ${message}`, 'fail');
        testsFailed++;
      }
    }

    // Test the amenity data structure and edit functionality
    log('<h2>Test 1: Amenity Data Structure</h2>', 'info');
    
    const testAmenity = {
      en: 'King Size Bed',
      nl: 'Kingsize Bed',
      fr: 'Lit King Size',
      icon: 'bed'
    };
    
    assert(testAmenity.en === 'King Size Bed', 'English name is correct');
    assert(testAmenity.nl === 'Kingsize Bed', 'Dutch name is correct');
    assert(testAmenity.fr === 'Lit King Size', 'French name is correct');
    assert(testAmenity.icon === 'bed', 'Icon is correct');

    // Test 2: Simulate amenity list with edit buttons
    log('<h2>Test 2: Amenity Rendering with Edit Button</h2>', 'info');
    
    const currentAmenities = [
      { en: 'King Size Bed', nl: 'Kingsize Bed', fr: 'Lit King Size', icon: 'bed' },
      { en: 'TV', nl: 'TV', fr: 'Télévision', icon: 'tv' }
    ];

    const container = document.createElement('div');
    container.className = 'test-section';
    
    currentAmenities.forEach((amenity, index) => {
      const div = document.createElement('div');
      div.className = 'amenity-item';
      
      const amenityName = amenity.en || amenity.name || 'Unnamed';
      
      div.innerHTML = `
        <div class="amenity-icon-preview">${IconLibrary.getIcon(amenity.icon)}</div>
        <span>${amenityName}</span>
        <button type="button" class="edit" data-action="edit" data-index="${index}">
          ✎ Edit
        </button>
        <button type="button" class="delete" data-action="delete" data-index="${index}">
          ✕
        </button>
      `;
      
      container.appendChild(div);
    });
    
    testResults.appendChild(container);
    
    const editButtons = container.querySelectorAll('button[data-action="edit"]');
    const deleteButtons = container.querySelectorAll('button[data-action="delete"]');
    
    assert(editButtons.length === 2, 'Two edit buttons rendered');
    assert(deleteButtons.length === 2, 'Two delete buttons rendered');
    assert(editButtons[0].textContent.includes('Edit'), 'Edit button has correct text');

    // Test 3: Edit mode simulation
    log('<h2>Test 3: Edit Mode Simulation</h2>', 'info');
    
    let editingAmenityIndex = null;
    
    function simulateEditMode(index) {
      editingAmenityIndex = index;
      return currentAmenities[index];
    }
    
    const amenityToEdit = simulateEditMode(0);
    
    assert(editingAmenityIndex === 0, 'Edit mode index set correctly');
    assert(amenityToEdit.en === 'King Size Bed', 'Retrieved correct amenity for editing');
    assert(amenityToEdit.nl === 'Kingsize Bed', 'Dutch name available for editing');
    assert(amenityToEdit.fr === 'Lit King Size', 'French name available for editing');

    // Test 4: Update operation
    log('<h2>Test 4: Update Operation</h2>', 'info');
    
    const updatedData = {
      en: 'Super King Size Bed',
      nl: 'Super Kingsize Bed',
      fr: 'Lit Super King Size',
      icon: 'king_bed'
    };
    
    // Simulate update
    const testArray = [...currentAmenities];
    testArray[editingAmenityIndex] = updatedData;
    
    assert(testArray[0].en === 'Super King Size Bed', 'English name updated');
    assert(testArray[0].nl === 'Super Kingsize Bed', 'Dutch name updated');
    assert(testArray[0].fr === 'Lit Super King Size', 'French name updated');
    assert(testArray[0].icon === 'king_bed', 'Icon updated');
    assert(testArray[1].en === 'TV', 'Other amenities unchanged');

    // Test 5: Backward compatibility
    log('<h2>Test 5: Backward Compatibility</h2>', 'info');
    
    const oldFormatAmenity = {
      name: 'Single Bed',
      icon: 'bed'
    };
    
    const displayName = oldFormatAmenity.en || oldFormatAmenity.name || 'Unnamed';
    
    assert(displayName === 'Single Bed', 'Old format (name field) still works for display');

    // Summary
    log('<h2>Test Summary</h2>', 'info');
    log(`Tests passed: ${testsPassed}`, 'pass');
    log(`Tests failed: ${testsFailed}`, testsFailed > 0 ? 'fail' : 'pass');
    log(`Total tests: ${testsPassed + testsFailed}`, 'info');
    
    if (testsFailed === 0) {
      log('<br><strong class="pass">✓ All tests passed! The amenity edit functionality should work correctly.</strong>', 'pass');
    } else {
      log('<br><strong class="fail">✗ Some tests failed. Review the implementation.</strong>', 'fail');
    }
  </script>
</body>
</html>
