<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firebase Diagnostics - Hotel 3 Paardekens</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    h1 {
      color: #333;
      margin-bottom: 10px;
      font-size: 28px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 16px;
    }

    .test {
      background: #f8f9fa;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      border-left: 4px solid #ccc;
    }

    .test h2 {
      font-size: 18px;
      margin-bottom: 10px;
      color: #333;
    }

    .test-status {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .status-pending {
      background: #ffc107;
      color: #000;
    }

    .status-success {
      background: #28a745;
      color: white;
    }

    .status-error {
      background: #dc3545;
      color: white;
    }

    .test.success {
      border-left-color: #28a745;
    }

    .test.error {
      border-left-color: #dc3545;
    }

    .test-details {
      font-size: 14px;
      line-height: 1.6;
      color: #555;
      margin-top: 10px;
    }

    .test-details code {
      background: #e9ecef;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 13px;
    }

    .fix-button {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .fix-button:hover {
      background: #0056b3;
    }

    .overall-status {
      text-align: center;
      padding: 30px;
      margin-bottom: 30px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 600;
    }

    .overall-status.success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }

    .overall-status.error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }

    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    pre {
      background: #f4f4f4;
      border: 1px solid #ddd;
      border-radius: 4px;
      padding: 10px;
      overflow-x: auto;
      font-size: 12px;
      margin-top: 10px;
    }

    .action-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }

    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #5568d3;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔧 Firebase Diagnostics</h1>
    <p class="subtitle">Testing Firebase configuration and connectivity for Hotel 3 Paardekens</p>

    <div id="overallStatus" class="overall-status" style="display:none;"></div>

    <div class="action-buttons">
      <button id="runTests">Run Diagnostics</button>
      <button id="viewConsole" onclick="alert('Press F12 (or Cmd+Option+I on Mac) to open the browser console')">View Console</button>
    </div>

    <div id="results"></div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  
  <!-- Firebase Configuration -->
  <script src="firebase-config.js"></script>

  <script>
    const results = document.getElementById('results');
    const overallStatus = document.getElementById('overallStatus');
    const runTestsBtn = document.getElementById('runTests');

    let testsPassed = 0;
    let testsFailed = 0;

    function addTest(title, status, details, fixLink) {
      const test = document.createElement('div');
      test.className = `test ${status}`;
      
      let statusBadge = '';
      if (status === 'success') {
        statusBadge = '<span class="test-status status-success">✓ PASSED</span>';
        testsPassed++;
      } else if (status === 'error') {
        statusBadge = '<span class="test-status status-error">✕ FAILED</span>';
        testsFailed++;
      } else {
        statusBadge = '<span class="test-status status-pending">⏳ TESTING</span>';
      }

      let fixButton = '';
      if (fixLink) {
        fixButton = `<a href="${fixLink}" class="fix-button" target="_blank">How to Fix →</a>`;
      }

      test.innerHTML = `
        <h2>${title}</h2>
        ${statusBadge}
        <div class="test-details">${details}</div>
        ${fixButton}
      `;
      
      results.appendChild(test);
      return test;
    }

    function updateOverallStatus() {
      if (testsFailed === 0) {
        overallStatus.className = 'overall-status success';
        overallStatus.innerHTML = '✅ All tests passed! Your Firebase is configured correctly.';
      } else {
        overallStatus.className = 'overall-status error';
        overallStatus.innerHTML = `❌ ${testsFailed} test(s) failed. Please follow the fix instructions below.`;
      }
      overallStatus.style.display = 'block';
    }

    async function runDiagnostics() {
      results.innerHTML = '';
      testsPassed = 0;
      testsFailed = 0;
      overallStatus.style.display = 'none';
      runTestsBtn.disabled = true;

      // Test 1: Firebase SDK Loaded
      if (typeof firebase !== 'undefined') {
        addTest(
          'Test 1: Firebase SDK Loaded',
          'success',
          'Firebase SDK is loaded and available. Version: ' + firebase.SDK_VERSION
        );
      } else {
        addTest(
          'Test 1: Firebase SDK Loaded',
          'error',
          'Firebase SDK is not loaded. Check that firebase-app-compat.js is included in your HTML.',
          'https://firebase.google.com/docs/web/setup'
        );
        updateOverallStatus();
        runTestsBtn.disabled = false;
        return;
      }

      // Test 2: Firebase Initialized
      if (firebase.apps && firebase.apps.length > 0) {
        const app = firebase.apps[0];
        addTest(
          'Test 2: Firebase App Initialized',
          'success',
          `Firebase app initialized successfully.<br>Project ID: <code>${app.options.projectId}</code><br>Database URL: <code>${app.options.databaseURL}</code>`
        );
      } else {
        addTest(
          'Test 2: Firebase App Initialized',
          'error',
          'Firebase app is not initialized. Check firebase-config.js is loaded and contains valid configuration.',
          'FIREBASE_SETUP.md'
        );
        updateOverallStatus();
        runTestsBtn.disabled = false;
        return;
      }

      // Test 3: Database Connection
      try {
        const db = firebase.database();
        const connectedRef = db.ref('.info/connected');
        const snapshot = await connectedRef.once('value');
        const connected = snapshot.val();
        
        if (connected) {
          addTest(
            'Test 3: Database Connection',
            'success',
            'Successfully connected to Firebase Realtime Database.'
          );
        } else {
          addTest(
            'Test 3: Database Connection',
            'error',
            'Firebase SDK loaded but not connected to database. Check your internet connection and database URL.',
            'FIREBASE_SETUP.md'
          );
        }
      } catch (error) {
        addTest(
          'Test 3: Database Connection',
          'error',
          `Database connection failed: <code>${error.message}</code><br>Check that Realtime Database is enabled in Firebase Console.`,
          'FIREBASE_SETUP.md'
        );
      }

      // Test 4: Read Access
      try {
        const db = firebase.database();
        const snapshot = await db.ref('infoBlocks').once('value');
        const data = snapshot.val();
        
        addTest(
          'Test 4: Read Access',
          'success',
          `Successfully read from database. Found ${data ? Object.keys(data).length : 0} info blocks.`
        );
      } catch (error) {
        addTest(
          'Test 4: Read Access',
          'error',
          `Read permission denied: <code>${error.message}</code><br>Check your Firebase security rules allow read access.`,
          'FIREBASE_RULES_UPDATE.md'
        );
      }

      // Test 5: Authentication Status
      try {
        if (firebase.auth) {
          const user = firebase.auth().currentUser;
          if (user) {
            addTest(
              'Test 5: Authentication',
              'success',
              `Authenticated as: <code>${user.email || user.uid}</code><br>You can write to the database.`
            );
          } else {
            addTest(
              'Test 5: Authentication',
              'error',
              'Not authenticated with Firebase. Log in to the admin panel to authenticate.<br><strong>Impact:</strong> Cannot write data to Firebase (only localStorage).',
              'FIREBASE_AUTHENTICATION_SETUP.md'
            );
          }
        } else {
          addTest(
            'Test 5: Authentication',
            'error',
            'Firebase Authentication SDK not loaded. Include firebase-auth-compat.js in your HTML.',
            'FIREBASE_AUTH_SETUP.md'
          );
        }
      } catch (error) {
        addTest(
          'Test 5: Authentication',
          'error',
          `Authentication check failed: <code>${error.message}</code>`,
          'FIREBASE_AUTH_SETUP.md'
        );
      }

      // Test 6: Write Access (requires authentication)
      const user = firebase.auth ? firebase.auth().currentUser : null;
      if (user) {
        try {
          const db = firebase.database();
          const testRef = db.ref('_diagnostics/test');
          const testData = {
            timestamp: Date.now(),
            test: true
          };
          
          await testRef.set(testData);
          await testRef.remove(); // Clean up
          
          addTest(
            'Test 6: Write Access',
            'success',
            'Successfully wrote to and deleted from database. Write permissions are working correctly.'
          );
        } catch (error) {
          addTest(
            'Test 6: Write Access',
            'error',
            `Write permission denied: <code>${error.message}</code><br>Check Firebase security rules allow authenticated writes.`,
            'FIREBASE_AUTHENTICATION_SETUP.md'
          );
        }
      } else {
        addTest(
          'Test 6: Write Access',
          'error',
          'Cannot test write access: Not authenticated. Log in to the admin panel first.',
          'FIREBASE_AUTHENTICATION_SETUP.md'
        );
      }

      // Test 7: Data Sync
      try {
        const db = firebase.database();
        const roomsSnapshot = await db.ref('rooms').once('value');
        const roomsData = roomsSnapshot.val();
        
        if (roomsData) {
          addTest(
            'Test 7: Data Synchronization',
            'success',
            `Successfully retrieved rooms data from Firebase. Found ${Object.keys(roomsData).length} room(s).<br>Data is syncing correctly across browsers.`
          );
        } else {
          addTest(
            'Test 7: Data Synchronization',
            'error',
            'No rooms data found in Firebase. Data may not be syncing.<br>Try creating a room in the admin panel.',
            'FIREBASE_AUTHENTICATION_SETUP.md'
          );
        }
      } catch (error) {
        addTest(
          'Test 7: Data Synchronization',
          'error',
          `Could not read rooms data: <code>${error.message}</code>`,
          'FIREBASE_SETUP.md'
        );
      }

      updateOverallStatus();
      runTestsBtn.disabled = false;
    }

    runTestsBtn.addEventListener('click', runDiagnostics);

    // Auto-run on page load
    window.addEventListener('load', () => {
      setTimeout(runDiagnostics, 500);
    });
  </script>
</body>
</html>
