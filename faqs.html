<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FAQs | Hotel 3 Paardekens</title>
  <meta name="description" content="Frequently asked questions for Hotel 3 Paardekens." />

  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />

  <style>
    :root {
      --card-bg: rgba(0, 0, 0, 0.15);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --accent: #B76E79;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: #000;
    }
    .bg {
      min-height: 100vh;
      background: none;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 50px;
      padding: 28px;
    }
    .bg::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
        url("assets/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translateZ(0);
      will-change: transform;
    }
    .bg.with-menubar { padding-top: calc(70px + 50px + 28px); }
    .card {
      width: min(980px, 100%);
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 40px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .menubar.card {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 9999;
      height: 70px;
      min-height: 70px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      background: rgba(0, 0, 0, 0.55);
    }
    .menu-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 100%;
      position: relative;
    }
    @media (min-width: 600px) {
      .menu-row {
        justify-content: flex-end;
      }
    }
    .menu-logo {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-left: 2px;
      border-bottom: 0 !important;
      text-decoration: none !important;
    }
    .menu-logo:hover {
      border-bottom: 0 !important;
      text-decoration: none !important;
    }
    .menu-logo img {
      height: 46px;
      width: auto;
      display: block;
    }
    .menubar .pill {
      gap: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 120ms ease;
      padding: 10px 12px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    @media (min-width: 600px) {
      .menubar .pill {
        width: 94px;
      }
    }
    .menubar .pill:hover,
    .menubar .pill:focus,
    .menubar .pill:active {
      background: var(--accent);
      outline: none;
    }
    h1 {
      margin: 0 0 20px;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 500;
      text-align: center;
    }
    .faq-list {
      display: grid;
      gap: 14px;
    }
    .faq-item {
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px;
      background: rgba(0,0,0,0.35);
      overflow: hidden;
    }
    .faq-item summary {
      list-style: none;
      cursor: pointer;
      padding: 16px 20px;
      font-size: clamp(16px, 2.2vw, 18px);
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .faq-item summary::-webkit-details-marker { display: none; }
    .faq-item summary::after {
      content: "+";
      color: var(--accent);
      font-size: 24px;
      line-height: 1;
      transition: transform 140ms ease;
    }
    .faq-item[open] summary::after {
      content: "-";
      transform: rotate(180deg);
    }
    .faq-answer {
      border-top: 1px solid rgba(255,255,255,0.12);
      padding: 16px 20px 20px;
      color: var(--muted);
      line-height: 1.7;
      font-size: clamp(15px, 2vw, 17px);
    }
    .faq-answer p {
      margin: 0 0 12px 0;
    }
    .faq-answer p:last-child {
      margin-bottom: 0;
    }
    .faq-answer ul,
    .faq-answer ol {
      margin: 12px 0;
      padding-left: 24px;
    }
    .faq-answer li {
      margin: 6px 0;
    }
    .faq-answer strong {
      color: var(--text);
      font-weight: 600;
    }
    .faq-answer em {
      font-style: italic;
    }
    .faq-answer u {
      text-decoration: underline;
    }
    .faq-answer blockquote {
      margin: 12px 0;
      padding-left: 16px;
      border-left: 3px solid var(--accent);
      opacity: 0.9;
    }
    .faq-answer code {
      background: rgba(255,255,255,0.08);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    .faq-answer pre {
      background: rgba(255,255,255,0.08);
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
      margin: 12px 0;
    }
    .faq-answer a,
    .faq-answer a:visited {
      color: var(--accent);
    }
    .faq-answer a:hover {
      text-decoration: underline;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px 20px;
      color: var(--muted);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <main class="bg with-menubar">
    <section class="card menubar" id="menubar" aria-label="Menu bar"></section>

    <div class="card">
      <h1>FAQs</h1>
      <div id="faqBlocks" class="faq-list"></div>
      <div id="emptyState" class="empty-state" style="display: none;">No FAQs available yet.</div>
    </div>
  </main>

  <div id="footerContainer"></div>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.8/dist/purify.min.js" 
          integrity="sha384-OLBgp1GsljhM2TJ+sbHjaiH9txEUvgdDTAzHv2P24donTt6/529l+9Ua0vFImLlb" 
          crossorigin="anonymous"></script>
  <script src="firebase-config.js"></script>
  <script src="translations.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/footer.js"></script>
  <script>
    if (window.i18n) {
      window.i18n.init();
    }

    (function() {
      'use strict';

      const STORAGE_KEY = 'hotel3p_faq';
      const FIREBASE_PATH = 'faqBlocks';

      function getDatabase() {
        if (typeof firebase === 'undefined' || !firebase.database) return null;
        if (!firebase.apps || firebase.apps.length === 0) return null;
        try {
          return firebase.database();
        } catch (_) {
          return null;
        }
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text || '';
        return div.innerHTML;
      }

      function formatBody(text) {
        function linkifyUrls(html) {
          const container = document.createElement('div');
          container.innerHTML = html;
          const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
          const textNodes = [];

          let node;
          while ((node = walker.nextNode())) {
            if (node.parentElement && node.parentElement.closest('a')) continue;
            textNodes.push(node);
          }

          textNodes.forEach(textNode => {
            const text = textNode.textContent || '';
            const urlRegex = /(https?:\/\/[^\s<>"']+|www\.[^\s<>"']+)/gi;
            const fragment = document.createDocumentFragment();
            let lastIndex = 0;
            let match;

            while ((match = urlRegex.exec(text)) !== null) {
              const url = match[0];
              const href = url.toLowerCase().startsWith('www.') ? `https://${url}` : url;
              if (match.index > lastIndex) {
                fragment.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
              }

              const link = document.createElement('a');
              link.href = href;
              link.textContent = url;
              link.target = '_blank';
              link.rel = 'noopener noreferrer';
              fragment.appendChild(link);

              lastIndex = match.index + url.length;
            }

            if (lastIndex < text.length) {
              fragment.appendChild(document.createTextNode(text.slice(lastIndex)));
            }

            textNode.parentNode.replaceChild(fragment, textNode);
          });

          return container.innerHTML;
        }

        // Sanitize HTML to allow safe formatting while preventing XSS
        // Uses DOMPurify with a minimal whitelist approach for maximum security
        if (!text) return '';
        
        // Check if DOMPurify is available
        if (typeof DOMPurify !== 'undefined') {
          const linkSecurityHook = function(node) {
            if (node.tagName === 'A' && node.getAttribute('target') === '_blank') {
              const existingRel = node.getAttribute('rel') || '';
              const relValues = existingRel.split(/\s+/).filter(v => v);
              if (!relValues.includes('noopener')) relValues.push('noopener');
              if (!relValues.includes('noreferrer')) relValues.push('noreferrer');
              node.setAttribute('rel', relValues.join(' '));
            }
          };
          
          DOMPurify.addHook('afterSanitizeAttributes', linkSecurityHook);
          
          const sanitized = DOMPurify.sanitize(text, {
            ALLOWED_TAGS: ['p', 'br', 'strong', 'em', 'u', 's', 'span', 'a', 'ul', 'ol', 'li', 'blockquote', 'code', 'pre', 'sub', 'sup'],
            ALLOWED_ATTR: ['href', 'target', 'rel', 'class', 'style'],
          });
          
          DOMPurify.removeHook('afterSanitizeAttributes', linkSecurityHook);
          
          return linkifyUrls(sanitized);
        }
        
        const parser = new DOMParser();
        const parsed = parser.parseFromString(text, 'text/html');
        const preservedLinks = [];
        let preservedLinkIndex = 0;
        parsed.body.querySelectorAll('a[href]').forEach(anchor => {
          const rawHref = (anchor.getAttribute('href') || '').trim();
          const normalizedHref = rawHref.toLowerCase().startsWith('www.') ? `https://${rawHref}` : rawHref;
          const isSafeHref = /^(https?:\/\/|mailto:|tel:)/i.test(normalizedHref);
          const linkText = (anchor.textContent || '').trim();

          if (!isSafeHref) {
            anchor.replaceWith(parsed.createTextNode(linkText));
            return;
          }

          const token = `__FAQ_LINK_${preservedLinkIndex++}__`;
          preservedLinks.push({
            token,
            href: normalizedHref,
            text: linkText || normalizedHref
          });
          anchor.replaceWith(parsed.createTextNode(token));
        });
        const plainText = parsed.body.textContent || '';
        let fallbackHtml = linkifyUrls(escapeHtml(plainText).replace(/\n/g, '<br>'));

        preservedLinks.forEach(link => {
          const safeHref = escapeHtml(link.href);
          const safeText = escapeHtml(link.text);
          const anchorHtml = `<a href="${safeHref}" target="_blank" rel="noopener noreferrer">${safeText}</a>`;
          fallbackHtml = fallbackHtml.replace(link.token, anchorHtml);
        });

        return fallbackHtml;
      }

      async function getFaqBlocks() {
        const db = getDatabase();
        if (!db) {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          } catch (_) {
            return [];
          }
        }

        try {
          const snapshot = await db.ref(FIREBASE_PATH).once('value');
          const data = snapshot.val();
          if (!data) return [];
          return Object.keys(data).map(key => ({ ...data[key], id: key })).sort((a, b) => a.order - b.order);
        } catch (_) {
          try {
            return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          } catch (_) {
            return [];
          }
        }
      }

      window.loadFAQBlocks = async function() {
        const blocks = await getFaqBlocks();
        const container = document.getElementById('faqBlocks');
        const emptyState = document.getElementById('emptyState');
        if (!container || !emptyState) return;

        if (!blocks.length) {
          container.innerHTML = '';
          emptyState.style.display = 'block';
          return;
        }

        emptyState.style.display = 'none';
        const currentLang = window.i18n ? window.i18n.getCurrentLanguage() : 'en';
        container.innerHTML = blocks.map(block => {
          const blockData = block[currentLang] || block.en || block;
          return `
            <details class="faq-item">
              <summary>${escapeHtml(blockData.title || '')}</summary>
              <div class="faq-answer">${formatBody(blockData.body || '')}</div>
            </details>
          `;
        }).join('');
      };

      window.addEventListener('languageChanged', window.loadFAQBlocks);

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.loadFAQBlocks);
      } else {
        window.loadFAQBlocks();
      }

      const db = getDatabase();
      if (db) {
        db.ref(FIREBASE_PATH).on('value', window.loadFAQBlocks);
      }
    })();
  </script>
</body>
</html>
