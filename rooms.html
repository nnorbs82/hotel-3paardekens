<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel 3 Paardekens - Rooms</title>
  <meta name="description" content="Hotel 3 Paardekens - Rooms overview" />
  <style>
    :root {
      --card-bg: rgba(0, 0, 0, 0.55);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: #000;
    }

    /* Amenities list (Single Room) - icon + text rows */
    .amenities {
      margin: 0;
      padding-left: 0;
      list-style: none;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .amenities li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 6px 0;
    }
    .amenity-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-top: 2px;
      color: rgba(255,255,255,0.85);
    }
    .amenity-icon svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>
</head>

<body>
  <!-- IMPORTANT: this is ONLY the Single Room text + amenities part updated to use SVG icons.
       There are NO emojis anywhere below. -->

  <article class="room-card" aria-label="Single Room">
    <h2 class="room-title">Single Room</h2>

    <p class="room-desc">Comfortable single room, ideal for short business stays.</p>
    <p class="room-desc" style="margin-top:-6px;">Amenities include:</p>

    <ul class="amenities" aria-label="Single Room amenities">
      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- Desk -->
          <svg viewBox="0 0 24 24">
            <path d="M4 7h16"></path>
            <path d="M6 7v10"></path>
            <path d="M18 7v10"></path>
            <path d="M6 12h12"></path>
            <path d="M8 17v2"></path>
            <path d="M16 17v2"></path>
          </svg>
        </span>
        <span>Desk</span>
      </li>

      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- TV -->
          <svg viewBox="0 0 24 24">
            <rect x="4" y="6" width="16" height="10" rx="2"></rect>
            <path d="M8 20h8"></path>
            <path d="M12 16v4"></path>
          </svg>
        </span>
        <span>Flat screen TV</span>
      </li>

      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- Shower -->
          <svg viewBox="0 0 24 24">
            <path d="M7 6a5 5 0 0 1 10 0"></path>
            <path d="M17 6v4"></path>
            <path d="M7 10h10"></path>
            <path d="M8 14l0 0"></path>
            <path d="M12 14l0 0"></path>
            <path d="M16 14l0 0"></path>
            <path d="M9 18l0 0"></path>
            <path d="M13 18l0 0"></path>
            <path d="M17 18l0 0"></path>
          </svg>
        </span>
        <span>Private bathroom with shower</span>
      </li>

      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- Hairdryer -->
          <svg viewBox="0 0 24 24">
            <path d="M4 10h8a4 4 0 0 1 4 4v2H9a5 5 0 0 1-5-5v-1z"></path>
            <path d="M16 12h4"></path>
            <path d="M18 12v4"></path>
            <path d="M14 8h2"></path>
          </svg>
        </span>
        <span>Hairdryer</span>
      </li>

      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- Hygiene products (bottle) -->
          <svg viewBox="0 0 24 24">
            <path d="M10 4h4"></path>
            <path d="M11 4v2"></path>
            <path d="M13 4v2"></path>
            <rect x="9" y="6" width="6" height="14" rx="2"></rect>
          </svg>
        </span>
        <span>Hygiene products</span>
      </li>

      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- Central heating (thermometer) -->
          <svg viewBox="0 0 24 24">
            <path d="M10 14a2 2 0 1 0 4 0V6a2 2 0 0 0-4 0v8z"></path>
            <path d="M12 20a4 4 0 0 0 2-7.5"></path>
            <path d="M12 20a4 4 0 0 1-2-7.5"></path>
          </svg>
        </span>
        <span>Central heating</span>
      </li>

      <li>
        <span class="amenity-icon" aria-hidden="true">
          <!-- Luggage rack (suitcase icon) -->
          <svg viewBox="0 0 24 24">
            <rect x="7" y="7" width="10" height="14" rx="2"></rect>
            <path d="M9 7V5a3 3 0 0 1 6 0v2"></path>
            <path d="M10 11v6"></path>
            <path d="M14 11v6"></path>
          </svg>
        </span>
        <span>Luggage rack</span>
      </li>
    </ul>
  </article>
</body>
</html>
