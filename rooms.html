<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel 3 Paardekens - Rooms</title>
  <meta name="description" content="Hotel 3 Paardekens - Rooms overview" />
  <link rel="stylesheet" href="assets/nav.css">
  <style>
    :root {
      --card-bg: rgba(0, 0, 0, 0.55);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: #000;
    }

    .bg {
      min-height: 100vh;

      /* iOS/WebKit fix: do not use background-attachment: fixed */
      background: none;

      /* create stacking context so ::before can sit behind content reliably */
      position: relative;
      isolation: isolate;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
      padding: 28px;
    }

    /* Fixed background layer (replaces background-attachment: fixed) */
    .bg::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;

      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
        url("assets/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;

      /* Helps iOS keep it on its own layer */
      transform: translateZ(0);
      will-change: transform;
    }

    /* Extra top padding to account for fixed menubar (70px) + gap (50px) */
    .bg.with-menubar {
      padding-top: calc(70px + 50px + 28px);
    }

    .card {
      width: min(980px, 100%);
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 40px);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }

    @supports not (gap: 50px) {
      .card + .card { margin-top: 50px; }
    }

    /* Fixed top menubar - full width, square corners */
    .menubar.card {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 9999;
      height: 70px;
      min-height: 70px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0; /* all corners 0 roundness */
    }

    .menu-row {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 100%;
    }

    /* Right-align menu items on desktop */
    @media (min-width: 600px) {
      .menu-row {
        justify-content: flex-end;
      }
    }

    /* logo on the left inside menubar (match index.html) */
    .menu-logo {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-left: 2px;

      /* remove ALL link underline/border styling */
      border-bottom: 0 !important;
      text-decoration: none !important;
    }

    .menu-logo:hover {
      border-bottom: 0 !important;
      text-decoration: none !important;
    }

    .menu-logo img {
      height: 46px;
      width: auto;
      display: block;
    }

    /* Make menubar buttons match index.html */
    .menubar .pill {
      gap: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 120ms ease;
      padding: 10px 12px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Desktop width for menu pills */
    @media (min-width: 600px) {
      .menubar .pill {
        width: 94px;
      }
    }

    .menubar .pill:hover,
    .menubar .pill:focus,
    .menubar .pill:active { background: #B76E79; outline: none; }

    /* Keep general pill styling for non-menubar buttons */
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 120ms ease;
    }

    .pill:hover, .pill:focus, .pill:active { background: #B76E79; outline: none; }

    h1 { margin: 0 0 10px 0; font-size: clamp(26px, 4vw, 40px); }
    .muted { color: var(--muted); font-size: 16px; }

    .rooms-grid {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      text-align: left;
    }

    .room-card {
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      padding: 16px;
      background: rgba(255,255,255,0.04);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Amenities list (Single/Twin/Double) - CLEAN LINE SVG ICONS */
    .amenities {
      margin: 0;
      padding-left: 0;
      list-style: none;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .amenities li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin: 6px 0;
    }
    .amenity-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 18px;
      margin-top: 2px;
      color: rgba(255,255,255,0.85);
    }
    .amenity-icon svg {
      width: 18px;
      height: 18px;
      display: block;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== Slider ===== */
    .room-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9; /* slightly taller card */
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.2);
      outline: none;
      cursor: zoom-in;
    }

    .room-slider:focus-visible {
      box-shadow: 0 0 0 3px rgba(183,110,121,0.55);
    }

    .room-slider-track {
      display: flex;
      height: 100%;
      width: 100%;
      transform: translateX(0%);
      transition: transform 320ms ease;
      will-change: transform;
    }

    .room-slide {
      flex: 0 0 100%;
      height: 100%;
    }

    /* Small room cards: crop to fill */
    .room-slide img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .slider-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(0,0,0,0.35);
      color: #fff;
      display: grid;
      place-items: center;
      cursor: pointer;
      user-select: none;
      padding: 0;
      line-height: 1;
      transition: background-color 120ms ease, transform 120ms ease;
    }

    .slider-btn:hover,
    .slider-btn:focus-visible {
      background: #B76E79;
      outline: none;
    }

    .slider-btn:active { transform: translateY(-50%) scale(0.98); }

    .slider-btn.prev { left: 10px; }
    .slider-btn.next { right: 10px; }

    .slider-btn[disabled] {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .slider-counter {
      position: absolute;
      right: 10px;
      bottom: 10px;
      font-size: 12px;
      color: rgba(255,255,255,0.9);
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 999px;
      padding: 6px 10px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      pointer-events: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .room-slider-track { transition: none; }
    }
    /* ===== End slider ===== */

    /* ===== Popup (Lightbox) ===== */
    .popup-overlay {
      position: fixed;
      inset: 0;
      z-index: 10000; /* above menubar */
      background: rgba(0,0,0,0.45); /* less dark */
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .popup-overlay.is-open { display: flex; }

    .popup-card {
      width: min(1100px, 100%);
      background: rgba(0,0,0,0.72);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 16px;
      box-shadow: 0 22px 80px rgba(0,0,0,0.55);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      position: relative;
      padding: 16px;
      text-align: left;
    }

    .popup-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 4px 6px 12px 6px;
    }

    .popup-title {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      color: rgba(255,255,255,0.95);
    }

    .popup-close {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.06);
      color: #fff;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: background-color 120ms ease, transform 120ms ease;
    }

    .popup-close:hover,
    .popup-close:focus-visible {
      background: #B76E79;
      outline: none;
    }
    .popup-close:active { transform: scale(0.98); }

    .popup-slider {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(0,0,0,0.2);
      outline: none;
    }

    /* Popup large images: do NOT crop */
    .popup-slider .room-slide img {
      object-fit: contain;
      background: rgba(0,0,0,0.35);
    }

    .popup-slider .slider-btn { width: 46px; height: 46px; }
    .popup-slider .slider-btn.prev { left: 12px; }
    .popup-slider .slider-btn.next { right: 12px; }
    .popup-slider .slider-counter { right: 12px; bottom: 12px; }

    .popup-thumbs-row { margin-top: 12px; }

    /* Thumbnails under the large image */
    .slider-thumbs {
      position: static;
      display: flex;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 14px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      overflow: auto hidden;
      scrollbar-width: none; /* Firefox */
    }
    .slider-thumbs::-webkit-scrollbar { display: none; }

    .thumb {
      flex: 0 0 auto;
      width: 74px;
      height: 48px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.20);
      background: rgba(255,255,255,0.06);
      padding: 0;
      cursor: pointer;
      overflow: hidden;
      display: grid;
      place-items: stretch;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: saturate(1.05);
    }

    .thumb:hover,
    .thumb:focus-visible {
      outline: none;
      border-color: rgba(255,255,255,0.6);
      transform: translateY(-1px);
    }

    .thumb[aria-current="true"] {
      border-color: rgba(255,255,255,0.95);
      box-shadow: 0 0 0 3px rgba(183,110,121,0.55);
      transform: translateY(-1px);
    }

    @media (max-width: 640px) {
      .popup-card { padding: 12px; }
      .popup-slider { aspect-ratio: 4 / 3; }
      .thumb { width: 64px; height: 44px; }
      .slider-thumbs { gap: 8px; padding: 8px 10px; }
    }
    /* ===== End popup ===== */

    .room-title { font-size: 18px; font-weight: 600; margin: 0; }
    .room-desc { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }

    .room-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    footer { margin-top: 18px; font-size: 13px; color: rgba(255,255,255,0.7); }
  </style>
</head>

<body>
  <main class="bg with-menubar">
    <!-- Fixed top menubar -->
    <section class="card menubar" id="menubar" aria-label="Menu bar">
      <!-- Navigation loaded via nav.js -->
    </section>

    <section id="rooms" class="card" aria-label="Rooms">
      <h1>Rooms</h1>
      <p class="muted">Explore our room types and check availability.</p>

      <div class="rooms-grid" id="roomsGrid" aria-label="Room types">
        <!-- Rooms will be dynamically loaded here -->
      </div>

      <footer>© <span id="y"></span> Hotel 3 Paardekens</footer>
    </section>
  </main>

  <!-- Popup overlay (large slideshow) -->
  <div class="popup-overlay" id="popupOverlay" aria-hidden="true">
    <div class="popup-card" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
      <div class="popup-header">
        <h3 class="popup-title" id="popupTitle">Room photos</h3>
        <button class="popup-close" type="button" id="popupClose" aria-label="Close popup">
          &#10005;
        </button>
      </div>

      <div class="popup-slider" id="popupSlider" tabindex="0" aria-label="Large room photos slider"></div>
      <div class="popup-thumbs-row" id="popupThumbsRow"></div>
    </div>
  </div>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
  </script>
  <script src="admin-room-manager.js"></script>
  <script>
    function getRoomImagesFromDataset(el) {
      const roomName = (el.dataset.room || 'Room').trim();
      const base = (el.dataset.base || '').trim(); // e.g. "Rooms/Single/"
      const ext = (el.dataset.ext || 'jpg').trim().replace(/^"./, '');
      const count = Number(el.dataset.count || 0);

      if (!base || !Number.isFinite(count) || count <= 0) {
        return { roomName, images: [] };
      }

      const images = Array.from({ length: count }, (_, i) => `${base}${i + 1}.${ext}`);
      return { roomName, images };
    }

    function buildSlider(sliderEl, { roomName, images }, opts = {}) {
      const {
        startIndex = 0,
        large = false,
        showThumbs = false,
        thumbsMountEl = null
      } = opts;

      let index = Math.min(Math.max(Number(startIndex) || 0, 0), images.length - 1);

      const track = document.createElement('div');
      track.className = 'room-slider-track';

      images.forEach((src, i) => {
        const slide = document.createElement('div');
        slide.className = 'room-slide';

        const img = document.createElement('img');
        img.loading = large ? 'eager' : 'lazy';
        img.src = src;
        img.alt = `${roomName} photo ${i + 1} of ${images.length}`;

        slide.appendChild(img);
        track.appendChild(slide);
      });

      const prevBtn = document.createElement('button');
      prevBtn.type = 'button';
      prevBtn.className = 'slider-btn prev';
      prevBtn.setAttribute('aria-label', `Previous ${roomName} photo`);
      prevBtn.innerHTML = '&#10094;';

      const nextBtn = document.createElement('button');
      nextBtn.type = 'button';
      nextBtn.className = 'slider-btn next';
      nextBtn.setAttribute('aria-label', `Next ${roomName} photo`);
      nextBtn.innerHTML = '&#10095;';

      const counter = document.createElement('div');
      counter.className = 'slider-counter';

      // Optional thumbnails
      let thumbsWrap = null;
      let thumbs = [];

      if (showThumbs) {
        thumbsWrap = document.createElement('div');
        thumbsWrap.className = 'slider-thumbs';
        thumbsWrap.setAttribute('aria-label', 'Photo thumbnails');

        thumbs = images.map((src, i) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'thumb';
          btn.setAttribute('aria-label', `Go to ${roomName} photo ${i + 1}`);

          const tImg = document.createElement('img');
          tImg.loading = 'lazy';
          tImg.src = src;
          tImg.alt = `Thumbnail ${i + 1}`;

          btn.appendChild(tImg);

          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            index = i;
            render();
          });

          thumbsWrap.appendChild(btn);
          return btn;
        });
      }

      sliderEl.innerHTML = '';
      sliderEl.appendChild(track);
      sliderEl.appendChild(prevBtn);
      sliderEl.appendChild(nextBtn);
      sliderEl.appendChild(counter);

      // Mount thumbs below the image if thumbsMountEl is provided
      if (thumbsWrap) {
        if (thumbsMountEl) {
          thumbsMountEl.innerHTML = '';
          thumbsMountEl.appendChild(thumbsWrap);
        } else {
          sliderEl.appendChild(thumbsWrap);
        }
      }

      function updateThumbs() {
        if (!thumbs.length) return;
        thumbs.forEach((t, i) => t.setAttribute('aria-current', String(i === index)));

        const active = thumbs[index];
        if (active && active.scrollIntoView) {
          active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
        }
      }

      function render() {
        track.style.transform = `translateX(${-index * 100}%)`;
        counter.textContent = `${index + 1} / ${images.length}`;
        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === images.length - 1;
        updateThumbs();
      }

      function prev() {
        if (index > 0) { index -= 1; render(); }
      }

      function next() {
        if (index < images.length - 1) { index += 1; render(); }
      }

      prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });
      nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });

      sliderEl.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') { e.preventDefault(); prev(); }
        if (e.key === 'ArrowRight') { e.preventDefault(); next(); }
      });

      render();

      return {
        getIndex: () => index,
        setIndex: (i) => { index = Math.min(Math.max(i, 0), images.length - 1); render(); },
        next,
        prev
      };
    }

    function initRoomSlider(sliderEl) {
      const data = getRoomImagesFromDataset(sliderEl);
      if (!data.images.length) return;

      // Build the small slider in the card.
      const api = buildSlider(sliderEl, data);

      // Clicking the slider opens the popup at current slide index.
      sliderEl.addEventListener('click', () => {
        openPopupForSlider(sliderEl, api.getIndex());
      });

      // Keyboard open (Enter/Space) when slider is focused.
      sliderEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openPopupForSlider(sliderEl, api.getIndex());
        }
      });
    }

    const popupOverlay = document.getElementById('popupOverlay');
    const popupClose = document.getElementById('popupClose');
    const popupTitle = document.getElementById('popupTitle');
    const popupSlider = document.getElementById('popupSlider');
    const popupThumbsRow = document.getElementById('popupThumbsRow');

    let lastFocusedEl = null;

    function openPopupForSlider(sourceSliderEl, startIndex) {
      const data = getRoomImagesFromDataset(sourceSliderEl);
      if (!data.images.length) return;

      lastFocusedEl = document.activeElement;

      popupTitle.textContent = data.roomName + ' photos';

      // Build large slider with thumbnails mounted below the image
      buildSlider(popupSlider, data, { startIndex, large: true, showThumbs: true, thumbsMountEl: popupThumbsRow });

      popupOverlay.classList.add('is-open');
      popupOverlay.setAttribute('aria-hidden', 'false');

      // Prevent background scroll
      document.body.style.overflow = 'hidden';

      // Focus the popup slider so arrow keys work immediately
      popupSlider.focus();
    }

    function closePopup() {
      popupOverlay.classList.remove('is-open');
      popupOverlay.setAttribute('aria-hidden', 'true');
      popupSlider.innerHTML = '';
      popupThumbsRow.innerHTML = '';

      document.body.style.overflow = '';

      if (lastFocusedEl && typeof lastFocusedEl.focus === 'function') {
        lastFocusedEl.focus();
      }
      lastFocusedEl = null;
    }

    popupClose.addEventListener('click', closePopup);

    // Click outside the card closes
    popupOverlay.addEventListener('click', (e) => {
      if (e.target === popupOverlay) closePopup();
    });

    // Escape closes
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && popupOverlay.classList.contains('is-open')) {
        e.preventDefault();
        closePopup();
      }
    });

    // Load rooms dynamically from RoomManager
    function loadRooms() {
      const roomsGrid = document.getElementById('roomsGrid');
      if (!roomsGrid) return;

      // Load room manager if available
      if (typeof RoomManager !== 'undefined') {
        const rooms = RoomManager.getRooms();
        renderRooms(rooms);
      }
    }

    function renderRooms(rooms) {
      const roomsGrid = document.getElementById('roomsGrid');
      if (!roomsGrid) return;

      roomsGrid.innerHTML = '';

      rooms.forEach(room => {
        const article = document.createElement('article');
        article.className = 'room-card';
        article.setAttribute('aria-label', room.name);

        // Create photo slider element
        const sliderDiv = document.createElement('div');
        sliderDiv.className = 'room-slider';
        sliderDiv.tabIndex = 0;
        sliderDiv.setAttribute('aria-label', `${room.name} photos slider`);
        
        // Store photos data in a way compatible with existing slider code
        const sortedPhotos = room.photos.sort((a, b) => a.order - b.order);
        sliderDiv.dataset.room = room.name;
        sliderDiv.dataset.photos = JSON.stringify(sortedPhotos.map(p => p.url));

        // Create title
        const title = document.createElement('h2');
        title.className = 'room-title';
        title.textContent = room.name;

        // Create description
        const desc = document.createElement('p');
        desc.className = 'room-desc';
        desc.textContent = room.description;

        // Create amenities label
        const amenitiesLabel = document.createElement('p');
        amenitiesLabel.className = 'room-desc';
        amenitiesLabel.style.marginTop = '-6px';
        amenitiesLabel.textContent = 'Amenities include:';

        // Create amenities list
        const amenitiesList = document.createElement('ul');
        amenitiesList.className = 'amenities';
        amenitiesList.setAttribute('aria-label', `${room.name} amenities`);

        room.amenities.forEach(amenity => {
          const li = document.createElement('li');
          
          const iconSpan = document.createElement('span');
          iconSpan.className = 'amenity-icon';
          iconSpan.setAttribute('aria-hidden', 'true');
          
          // Get icon from IconLibrary
          const iconSvg = typeof IconLibrary !== 'undefined' ? 
            IconLibrary.getIcon(amenity.icon) : '';
          iconSpan.innerHTML = iconSvg;
          
          li.appendChild(iconSpan);
          li.appendChild(document.createTextNode(' ' + amenity.name));
          amenitiesList.appendChild(li);
        });

        // Create actions
        const actions = document.createElement('div');
        actions.className = 'room-actions';
        
        const bookLink = document.createElement('a');
        bookLink.className = 'pill';
        bookLink.href = room.bookingUrl || 'https://app.mews.com/distributor/0a316d41-2e75-4b9d-b827-e77cd4fae3d6?mewsRoute=rooms';
        bookLink.target = '_blank';
        bookLink.rel = 'noopener noreferrer';
        bookLink.textContent = 'View Room';
        
        actions.appendChild(bookLink);

        // Assemble the article
        article.appendChild(sliderDiv);
        article.appendChild(title);
        article.appendChild(desc);
        if (room.amenities.length > 0) {
          article.appendChild(amenitiesLabel);
          article.appendChild(amenitiesList);
        }
        article.appendChild(actions);

        roomsGrid.appendChild(article);

        // Initialize slider for this room
        initRoomSlider(sliderDiv);
      });
    }

    // Modified getRoomImagesFromDataset to handle new format
    const originalGetRoomImages = getRoomImagesFromDataset;
    getRoomImagesFromDataset = function(el) {
      // Try new format first (JSON photos data)
      if (el.dataset.photos) {
        try {
          const photos = JSON.parse(el.dataset.photos);
          const roomName = (el.dataset.room || 'Room').trim();
          return { roomName, images: photos };
        } catch (e) {
          // Fall through to original format
        }
      }
      
      // Fall back to original format
      return originalGetRoomImages(el);
    };

    // Load rooms when DOM is ready
    loadRooms();
    
    // Re-initialize sliders for any pre-existing room-slider elements
    document.querySelectorAll('.room-slider').forEach(initRoomSlider);
  </script>
  <script src="assets/nav.js"></script>
</body>
</html>
