<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hotel 3 Paardekens - Info</title>
  <meta name="description" content="Hotel 3 Paardekens - Information" />
  <link rel="stylesheet" href="assets/nav.css">
  <style>
    :root {
      --card-bg: rgba(0, 0, 0, 0.15);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      --radius: 18px;
      --accent: #B76E79;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);
      background: #000;
    }

    .bg {
      min-height: 100vh;
      background: none;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
      padding: 28px;
    }

    /* Fixed background layer */
    .bg::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
        url("assets/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translateZ(0);
      will-change: transform;
    }

    .bg.with-menubar {
      padding-top: calc(70px + 50px + 28px);
    }

    .card {
      width: min(980px, 100%);
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 40px);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }

    @supports not (gap: 50px) {
      .card + .card { margin-top: 50px; }
    }

    .menubar.card {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 9999;
      height: 70px;
      min-height: 70px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Right-align menu items on desktop */
    @media (min-width: 600px) {
      .menu-row {
        justify-content: flex-end;
      }
    }

    .menu-logo {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-left: 2px;
      border-bottom: 0 !important;
      text-decoration: none !important;
    }
    .menu-logo:hover {
      border-bottom: 0 !important;
      text-decoration: none !important;
    }

    .menu-logo img {
      height: 46px;
      width: auto;
      display: block;
    }

    .menubar .pill {
      gap: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 120ms ease;
      padding: 10px 12px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Desktop width for menu pills */
    @media (min-width: 600px) {
      .menubar .pill {
        width: 94px;
      }
    }

    .menubar .pill:hover,
    .menubar .pill:focus,
    .menubar .pill:active {
      background: var(--accent);
      outline: none;
    }

    h1 {
      margin: 0 0 12px 0;
      font-size: clamp(32px, 5vw, 48px);
      font-weight: 500;
      line-height: 1.2;
    }

    .info-block {
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(24px, 4vw, 40px);
      border: 1px solid rgba(255,255,255,0.12);
      margin-bottom: 30px;
      text-align: left;
    }

    .info-block:last-child {
      margin-bottom: 0;
    }

    .info-block h2 {
      margin: 0 0 16px 0;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: 500;
      color: var(--text);
      line-height: 1.3;
    }

    .info-block-body {
      color: var(--muted);
      line-height: 1.7;
      font-size: clamp(15px, 2vw, 17px);
    }

    .info-block-body p {
      margin: 0 0 16px 0;
    }

    .info-block-body p:last-child {
      margin-bottom: 0;
    }

    .info-block-body h3 {
      margin: 24px 0 12px 0;
      font-size: clamp(20px, 3vw, 24px);
      font-weight: 500;
      color: var(--text);
    }

    .info-block-body h3:first-child {
      margin-top: 0;
    }

    .info-block-body ul,
    .info-block-body ol {
      margin: 0 0 16px 0;
      padding-left: 24px;
    }

    .info-block-body li {
      margin-bottom: 8px;
    }

    .info-block-body a {
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid rgba(183, 110, 121, 0.4);
      transition: border-color 120ms ease;
    }

    .info-block-body a:hover {
      border-bottom-color: var(--accent);
    }

    .info-block-body strong {
      font-weight: 600;
      color: var(--text);
    }

    .info-block-body em {
      font-style: italic;
    }

    .info-block-body blockquote {
      margin: 16px 0;
      padding-left: 20px;
      border-left: 4px solid var(--accent);
      color: rgba(255, 255, 255, 0.9);
      font-style: italic;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
    }

    .empty-state-icon {
      font-size: 64px;
      margin-bottom: 16px;
      opacity: 0.6;
    }

    .empty-state-title {
      font-size: clamp(24px, 4vw, 32px);
      margin: 0 0 12px 0;
      font-weight: 500;
    }

    .empty-state-desc {
      font-size: 16px;
      margin: 0;
      opacity: 0.8;
    }

    #infoBlocks {
      width: 100%;
    }
  </style>
</head>

<body>
  <main class="bg with-menubar">
    <section class="card menubar" id="menubar" aria-label="Menu bar">
      <!-- Navigation loaded via nav.js -->
    </section>

    <div class="card">
      <h1>Information</h1>
      
      <div id="infoBlocks">
        <!-- Info blocks will be loaded here -->
      </div>

      <div id="emptyState" class="empty-state" style="display: none;">
        <h2 class="empty-state-title">No Information Available</h2>
        <p class="empty-state-desc">Information will be displayed here once added by the administrator.</p>
      </div>
    </div>
  </main>

  <script src="assets/nav.js"></script>
  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'hotel3p_info';

      // Get info blocks from localStorage
      function getInfoBlocks() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
          try {
            return JSON.parse(stored);
          } catch (e) {
            console.error('Error parsing stored info blocks:', e);
            return [];
          }
        }
        return [];
      }

      // Load and display info blocks
      function loadInfoBlocks() {
        const infoBlocks = getInfoBlocks();
        const container = document.getElementById('infoBlocks');
        const emptyState = document.getElementById('emptyState');

        if (!container || !emptyState) return;

        if (infoBlocks.length === 0) {
          container.innerHTML = '';
          emptyState.style.display = 'block';
        } else {
          emptyState.style.display = 'none';
          
          // Sort by order
          infoBlocks.sort((a, b) => a.order - b.order);
          
          container.innerHTML = infoBlocks.map(block => `
            <div class="info-block">
              <h2>${block.title}</h2>
              <div class="info-block-body">${block.body}</div>
            </div>
          `).join('');
        }
      }

      // Initialize
      loadInfoBlocks();
    })();
  </script>
</body>
</html>
