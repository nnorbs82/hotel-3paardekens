  <style>
    :root {
      --card-bg: rgba(0, 0, 0, 0.15);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.85);
      --shadow: 0 16px 50px rgba(0, 0, 0, 0.35);

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {

      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: var(--text);

    }

    .bg {
      min-height: 100vh;
      background: none;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: 50px;
      padding: 28px;
    }

    /* Fixed background layer */
    .bg::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
        url("assets/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translateZ(0);
      will-change: transform;
    }

    .bg.with-menubar {
      padding-top: calc(70px + 50px + 28px);
    }

    .card {
      width: min(980px, 100%);
      background: var(--card-bg);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(20px, 4vw, 40px);
      text-align: center;
      border: 1px solid rgba(255,255,255,0.12);
    }

    @supports not (gap: 50px) {
      .card + .card { margin-top: 50px; }
    }

    .menubar.card {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 9999;
      height: 70px;
      min-height: 70px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      background: rgba(0, 0, 0, 0.55);
    }

    .menu-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Right-align menu items on desktop */
    @media (min-width: 600px) {
      .menu-row {
        justify-content: flex-end;
      }
    }

    .menu-logo {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      padding-left: 2px;
      border-bottom: 0 !important;
      text-decoration: none !important;
    }
    .menu-logo:hover {
      border-bottom: 0 !important;
      text-decoration: none !important;
    }

    .menu-logo img {
      height: 46px;
      width: auto;
      display: block;
    }

    .menubar .pill {
      gap: 8px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      transition: background-color 120ms ease;
      padding: 10px 12px;
      font-size: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    /* Desktop width for menu pills */
    @media (min-width: 600px) {
      .menubar .pill {
        width: 94px;
      }
    }

    .menubar .pill:hover,
    .menubar .pill:focus,

      background: var(--accent);
      outline: none;
    }

    h1 {

    .info-block {

  <script>
    // Initialize i18n after all scripts are loaded
    if (window.i18n) {
      window.i18n.init();
    }
    
    // Reload info blocks when language changes
    window.addEventListener('languageChanged', function() {
      if (typeof window.loadInfoBlocks === 'function') {
        window.loadInfoBlocks();
      }
    });
  </script>
  <script>
    (function() {
      'use strict';

      const STORAGE_KEY = 'hotel3p_info'; // Legacy localStorage key
      const FIREBASE_PATH = 'infoBlocks';

      // Helper to get Firebase database reference
      function getDatabase() {
        if (typeof firebase === 'undefined' || !firebase.database) {
          console.warn('Firebase not available, using localStorage fallback');
          return null;
        }
        
        // Check if Firebase app is initialized
        if (!firebase.apps || firebase.apps.length === 0) {
          console.warn('Firebase app not initialized, using localStorage fallback');
          return null;
        }
        
        try {
          const db = firebase.database();
          // Verify database is actually accessible
          if (!db) {
            console.warn('Firebase database not accessible, using localStorage fallback');
            return null;
          }
          return db;
        } catch (error) {
          console.error('Error accessing Firebase database:', error);
          return null;
        }
      }

      // Get info blocks from Firebase or localStorage fallback
      async function getInfoBlocks() {
        const db = getDatabase();
        
        if (!db) {
          // Fallback to localStorage if Firebase is not available
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            try {
              return JSON.parse(stored);
            } catch (e) {
              console.error('Error parsing stored info blocks:', e);
              return [];
            }
          }
          return [];
        }

        try {
          const snapshot = await db.ref(FIREBASE_PATH).once('value');
          const data = snapshot.val();
          
          if (!data) {
            // Try localStorage as fallback if Firebase is empty
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
              try {
                return JSON.parse(stored);
              } catch (e) {
                console.error('Error parsing localStorage data:', e);
                return [];
              }
            }
            return [];
          }
          
          // Convert Firebase object to array
          return Object.keys(data).map(key => ({
            ...data[key],
            id: key
          })).sort((a, b) => a.order - b.order);
        } catch (error) {
          console.error('Error fetching info blocks from Firebase:', error);
          // Fallback to localStorage on error
          const stored = localStorage.getItem(STORAGE_KEY);
          if (stored) {
            try {
              return JSON.parse(stored);
            } catch (e) {
              console.error('Error parsing localStorage data:', e);
              return [];
            }
          }
          return [];
        }
      }

      // Load and display info blocks - make it globally accessible
      window.loadInfoBlocks = async function() {
        const infoBlocks = await getInfoBlocks();
        const container = document.getElementById('infoBlocks');
        const emptyState = document.getElementById('emptyState');

        if (!container || !emptyState) return;

        if (infoBlocks.length === 0) {
          container.innerHTML = '';
          emptyState.style.display = 'block';
        } else {
          emptyState.style.display = 'none';
          
          // Get current language from i18n
          const currentLang = window.i18n ? window.i18n.getCurrentLanguage() : 'en';
          
          // Sort by order
          infoBlocks.sort((a, b) => a.order - b.order);
          
          container.innerHTML = infoBlocks.map(block => {
            // Get language-specific data or fallback to old format
            const blockData = block[currentLang] || block.en || block;
            const title = blockData.title || '';
            const body = blockData.body || '';
            
            return `
              <div class="info-block">
                <h2>${escapeHtml(title)}</h2>
                <div class="info-block-body">${body}</div>
              </div>
            `;
          }).join('');
        }
      }

      // Helper to escape HTML to prevent XSS
      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }

      // Initialize when page loads
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', window.loadInfoBlocks);
      } else {
        window.loadInfoBlocks();
      }
      
      // Also listen for Firebase real-time updates
      const db = getDatabase();
      if (db) {
        db.ref(FIREBASE_PATH).on('value', () => {
          window.loadInfoBlocks();
        });
      }
    })();
  </script>
