name: One-time performance QA

on:
  push:
    branches:
      - redesign
    paths:
      - .github/workflows/performance-qa.yml

permissions:
  contents: write

jobs:
  performance-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out redesign
        uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image inspector
        run: python -m pip install --quiet pillow

      - name: Apply safe loading improvements and audit images
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import json
          import re

          root = Path('.')

          def add_attrs_to_exact_image(html, src, attrs, count=0):
              pattern = rf'<img(?![^>]*\bloading=)([^>]*\bsrc="{re.escape(src)}"[^>]*)>'
              replacement = rf'<img {attrs}\1>'
              return re.sub(pattern, replacement, html, count=count)

          index_path = root / 'index.html'
          index = index_path.read_text(encoding='utf-8')
          if 'href="intro-signature.css"' not in index:
              index = index.replace(
                  '<link rel="stylesheet" href="modern-home.css">',
                  '<link rel="stylesheet" href="modern-home.css">\n  <link rel="stylesheet" href="intro-signature.css">'
              )

          index = index.replace(
              '<div class="hero-media"><img src="assets/background.jpg"',
              '<div class="hero-media"><img fetchpriority="high" decoding="async" src="assets/background.jpg"'
          )

          lazy_sources = [
              'assets/st-rumbolds-mechelen.webp',
              'aboutus/aboutus1.jpg',
              'Rooms/Single/1.jpg',
              'Rooms/Twin/1.jpg',
              'Rooms/Double/4.jpg',
              'Rooms/Double/6.jpg',
              'assets/3paardekens-breakfast.webp',
              'elisabeth/sisterhotel.jpg',
              'Rooms/Twin/2.jpg',
              'Rooms/Single/3.jpg',
          ]
          for src in lazy_sources:
              index = add_attrs_to_exact_image(index, src, 'loading="lazy" decoding="async" ')

          index = re.sub(
              r'(<a class="location-photo"[^>]*><img)(?![^>]*\bloading=)([^>]*\bsrc="assets/background\.jpg"[^>]*>)',
              r'\1 loading="lazy" decoding="async"\2',
              index,
              count=1,
          )
          index_path.write_text(index, encoding='utf-8')

          rooms_path = root / 'rooms.html'
          rooms = rooms_path.read_text(encoding='utf-8')
          rooms = rooms.replace(
              '<section class="rooms-hero"><div class="rooms-hero-media"><img src="Rooms/Double/5.jpg"',
              '<section class="rooms-hero"><div class="rooms-hero-media"><img fetchpriority="high" decoding="async" src="Rooms/Double/5.jpg"'
          )
          start = rooms.find('<section class="room-showcases">')
          end = rooms.find('</section>', start)
          if start != -1 and end != -1:
              segment = rooms[start:end]
              segment = re.sub(r'<img(?![^>]*\bloading=)', '<img loading="lazy" decoding="async"', segment)
              rooms = rooms[:start] + segment + rooms[end:]
          rooms_path.write_text(rooms, encoding='utf-8')

          home_path = root / 'home-modern.js'
          home = home_path.read_text(encoding='utf-8')
          home = re.sub(
              r"\n\s*const signatureSheet = document\.createElement\('link'\);\n\s*signatureSheet\.rel = 'stylesheet';\n\s*signatureSheet\.href = 'intro-signature\.css';\n\s*document\.head\.appendChild\(signatureSheet\);\n",
              '\n',
              home,
              count=1,
          )
          home_path.write_text(home, encoding='utf-8')

          candidates = []
          candidates.extend(sorted((root / 'Rooms').rglob('*.jpg')))
          candidates.extend(sorted((root / 'aboutus').glob('*.jpg')))
          candidates.extend(sorted((root / 'assets').glob('*.jpg')))
          candidates.extend(sorted((root / 'assets').glob('*.webp')))
          candidates.extend(sorted((root / 'elisabeth').glob('*.jpg')))

          report = []
          for path in candidates:
              try:
                  with Image.open(path) as image:
                      width, height = image.size
                      original = path.stat().st_size
                      estimated = None
                      if image.format in {'JPEG', 'PNG'}:
                          converted = image.convert('RGB')
                          buffer = BytesIO()
                          converted.save(buffer, 'WEBP', quality=88, method=6)
                          estimated = len(buffer.getvalue())
                      report.append({
                          'path': path.as_posix(),
                          'format': image.format,
                          'width': width,
                          'height': height,
                          'bytes': original,
                          'estimated_webp_q88_bytes': estimated,
                          'estimated_saving_percent': round((1 - estimated / original) * 100, 1) if estimated else None,
                      })
              except Exception as exc:
                  report.append({'path': path.as_posix(), 'error': str(exc)})

          report.sort(key=lambda item: item.get('bytes', 0), reverse=True)
          Path('performance-image-audit.json').write_text(
              json.dumps({'generated_by': 'one-time performance QA', 'images': report}, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          PY

      - name: Remove one-time workflow and commit results
        shell: bash
        run: |
          rm -f .github/workflows/performance-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "perf: defer noncritical images and audit photography"
          git push origin HEAD:redesign
