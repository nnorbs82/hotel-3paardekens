name: Final launch preparation

on:
  push:
    branches: [redesign]
    paths:
      - '.github/workflows/final-launch-prep.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign
          fetch-depth: 0

      - name: Prepare production-facing HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          search_pages = [
              'index.html','rooms.html','info.html','faqs.html','apple-wallet-faqs.html'
          ]
          all_pages = search_pages + [
              'privacy-policy.html','cookie-policy.html','terms-and-conditions.html'
          ]

          for name in search_pages:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text, count = re.subn(
                  r'<meta\s+name=["\']robots["\']\s+content=["\']noindex\s*,?\s*nofollow["\']\s*/?>',
                  '<meta name="robots" content="index, follow, max-image-preview:large">',
                  text,
                  flags=re.I
              )
              if count != 1:
                  raise SystemExit(f'{name}: expected exactly one noindex robots meta, found {count}')
              p.write_text(text, encoding='utf-8')

          for name in all_pages:
              p = Path(name)
              text = p.read_text(encoding='utf-8')
              text = re.sub(r'<span>Preview redesign - not the production website</span>', '', text)
              p.write_text(text, encoding='utf-8')

          seo = Path('site-seo.js')
          text = seo.read_text(encoding='utf-8')
          text = text.replace(
              "`${PROD_ORIGIN}/Rooms/Double/6.jpg`",
              "`${PROD_ORIGIN}/optimized/Rooms/Double/6.webp`"
          )
          seo.write_text(text, encoding='utf-8')
          PY

      - name: Validate JavaScript and JSON
        run: |
          for f in *.js; do node --check "$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          for p in Path('.').rglob('*.json'):
              json.loads(p.read_text(encoding='utf-8'))
          print('All JSON valid')
          PY

      - name: Validate launch state
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re, sys

          errors=[]
          search_pages=['index.html','rooms.html','info.html','faqs.html','apple-wallet-faqs.html']
          legal_pages=['privacy-policy.html','cookie-policy.html','terms-and-conditions.html']

          for name in search_pages:
              text=Path(name).read_text(encoding='utf-8')
              if 'content="index, follow, max-image-preview:large"' not in text:
                  errors.append(f'{name}: production robots tag missing')
              if 'Preview redesign - not the production website' in text:
                  errors.append(f'{name}: preview footer remains')

          for name in legal_pages:
              text=Path(name).read_text(encoding='utf-8')
              if not re.search(r'name=["\']robots["\']\s+content=["\']noindex', text, re.I):
                  errors.append(f'{name}: legal noindex missing')
              if 'Preview redesign - not the production website' in text:
                  errors.append(f'{name}: preview footer remains')

          expected_js='48c7f65dc1b96a6c995bea4c169471b2df10106d'
          expected_css='d9f191998681474bb49c2adb5a85a20489e8df2e'
          import subprocess
          js_sha=subprocess.check_output(['git','hash-object','booking-enhanced.js'],text=True).strip()
          css_sha=subprocess.check_output(['git','hash-object','booking-enhanced.css'],text=True).strip()
          if js_sha != expected_js: errors.append(f'booking-enhanced.js changed: {js_sha}')
          if css_sha != expected_css: errors.append(f'booking-enhanced.css changed: {css_sha}')

          image_map=json.loads(Path('optimized/image-map.json').read_text(encoding='utf-8'))
          for source,target in image_map.items():
              if not Path(source.lstrip('/')).exists(): errors.append(f'image map source missing: {source}')
              if not Path(target.lstrip('/')).exists(): errors.append(f'image map target missing: {target}')

          for room in Path('v2/content/rooms').glob('*.json'):
              data=json.loads(room.read_text(encoding='utf-8'))
              for lang in ['en','nl','fr','es','de']:
                  for field in ['name','strapline','description','amenities']:
                      key=f'{field}_{lang}'
                      if not data.get(key): errors.append(f'{room}: missing {key}')
              for image in data.get('gallery',[]):
                  local=re.sub(r'^/?images/legacy/rooms/', 'Rooms/', image, flags=re.I)
                  if not Path(local.lstrip('/')).exists(): errors.append(f'{room}: gallery file missing {image}')

          google=json.loads(Path('v2/content/faqs/general.json').read_text(encoding='utf-8'))
          for entry in google.get('entries',[]):
              for lang in ['en','nl','fr','es','de']:
                  if not entry.get(f'question_{lang}'): errors.append(f'Google FAQ missing question_{lang}')
                  if not entry.get(f'answer_{lang}'): errors.append(f'Google FAQ missing answer_{lang}')

          for lang,path in {
              'en':'v2/content/faqs/apple-wallet.json',
              'nl':'v2/content/faqs/apple-wallet-nl.json',
              'fr':'v2/content/faqs/apple-wallet-fr.json',
              'es':'v2/content/faqs/apple-wallet-es.json',
              'de':'v2/content/faqs/apple-wallet-de.json'
          }.items():
              data=json.loads(Path(path).read_text(encoding='utf-8'))
              for entry in data.get('entries',[]):
                  q=entry.get('question_en') if lang=='en' else entry.get('question')
                  a=entry.get('answer_en') if lang=='en' else entry.get('answer')
                  if not q or not a: errors.append(f'{path}: incomplete Apple FAQ entry')

          active_files=[
              'index.html','rooms.html','info.html','faqs.html','apple-wallet-faqs.html',
              'privacy-policy.html','cookie-policy.html','terms-and-conditions.html',
              'preview-site.js','preview-site-core.js','preview-info.js','preview-faq.js',
              'room-gallery-cms.js','booking-enhanced.js','home-modern.js','site-i18n-complete.js','site-seo.js'
          ]
          for name in active_files:
              text=Path(name).read_text(encoding='utf-8', errors='ignore')
              if 'firebase' in text.lower(): errors.append(f'{name}: Firebase reference remains')

          # Check straightforward local HTML file references.
          for name in ['index.html','rooms.html','info.html','faqs.html','apple-wallet-faqs.html','privacy-policy.html','cookie-policy.html','terms-and-conditions.html']:
              text=Path(name).read_text(encoding='utf-8')
              for attr,value in re.findall(r'\b(src|href)=["\']([^"\']+)["\']', text, re.I):
                  if value.startswith(('#','http://','https://','mailto:','tel:','data:')): continue
                  path=value.split('?',1)[0].split('#',1)[0].lstrip('/')
                  if path and not Path(path).exists(): errors.append(f'{name}: missing local reference {value}')

          if errors:
              print('\n'.join(errors))
              sys.exit(1)
          print('Final launch validation passed')
          PY

      - name: Remove one-time workflow
        run: rm .github/workflows/final-launch-prep.yml

      - name: Commit launch-ready state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'launch: prepare production metadata and final QA'
          git push origin HEAD:redesign
