<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Privacy Policy | Hotel 3 Paardekens</title>
  <meta name="description" content="Privacy policy for Hotel 3 Paardekens." />
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="stylesheet" href="assets/nav.css">
  <link rel="stylesheet" href="assets/footer.css">
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      color: #ffffff;
      background: #000;
    }
    .bg {
      min-height: 100vh;
      background: none;
      position: relative;
      isolation: isolate;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px;
    }
    .bg::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image:
        linear-gradient(to bottom, rgba(0,0,0,0.35), rgba(0,0,0,0.55)),
        url("assets/background.jpg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transform: translateZ(0);
      will-change: transform;
    }
    .bg.with-menubar { padding-top: calc(70px + 50px + 28px); }
    .card {
      width: min(980px, 100%);
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 18px;
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.35);
      padding: clamp(20px, 4vw, 40px);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .menubar.card {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      width: 100%;
      z-index: 9999;
      height: 70px;
      min-height: 70px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 0;
      background: rgba(0, 0, 0, 0.55);
    }
  </style>
</head>
<body>
  <main class="bg with-menubar">
    <section class="card menubar" id="menubar" aria-label="Menu bar"></section>
  </main>

  <div id="footerContainer"></div>

  <script src="translations.js"></script>
  <script src="assets/nav.js"></script>
  <script src="assets/footer.js"></script>
  <script>
    if (window.i18n) {
      window.i18n.init();
    }
  </script>
</body>
</html>
