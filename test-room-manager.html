<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Room Manager Fixes</title>
  <style>
    body {
      font-family: monospace;
      padding: 20px;
      background: #1a1a1a;
      color: #0f0;
    }
    .test-section {
      margin: 20px 0;
      padding: 15px;
      border: 1px solid #333;
      background: #0a0a0a;
    }
    .pass { color: #0f0; }
    .fail { color: #f00; }
    .info { color: #0af; }
    pre {
      background: #000;
      padding: 10px;
      overflow: auto;
    }
  </style>
</head>
<body>
  <h1>Room Manager Bug Fix Tests</h1>
  <div id="testResults"></div>

  <script>
    const testResults = document.getElementById('testResults');
    let testsPassed = 0;
    let testsFailed = 0;

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = type;
      div.textContent = message;
      testResults.appendChild(div);
    }

    function assert(condition, message) {
      if (condition) {
        log(`✓ PASS: ${message}`, 'pass');
        testsPassed++;
      } else {
        log(`✗ FAIL: ${message}`, 'fail');
        testsFailed++;
      }
    }

    // Test 1: Object.keys on array produces string indices
    log('\n=== Test 1: Array vs Object behavior ===', 'info');
    const objData = { single: { name: 'Single' }, twin: { name: 'Twin' }, double: { name: 'Double' } };
    const arrData = [{ id: 'single', name: 'Single' }, { id: 'twin', name: 'Twin' }, { id: 'double', name: 'Double' }];
    
    const objKeys = Object.keys(objData);
    const arrKeys = Object.keys(arrData);
    
    log(`Object keys: ${objKeys}`, 'info');
    log(`Array keys: ${arrKeys}`, 'info');
    
    assert(objKeys.includes('single'), 'Object.keys on object includes room IDs');
    assert(arrKeys.includes('0'), 'Object.keys on array produces string indices');
    assert(arrKeys[0] === '0', 'First array key is "0" (string)');

    // Test 2: Simulating the bug - mapping array with Object.keys
    log('\n=== Test 2: Bug simulation - mapping array with Object.keys ===', 'info');
    const buggyRooms = Object.keys(arrData).map(key => ({
      ...arrData[key],
      id: key  // This would create id: '0', '1', '2'
    }));
    
    log(`Buggy rooms IDs: ${buggyRooms.map(r => r.id)}`, 'info');
    assert(buggyRooms[0].id === '0', 'Bug confirmed: array mapping produces numeric string IDs');
    assert(buggyRooms[0].name === 'Single', 'But room data is still intact');

    // Test 3: The fix - detecting and converting array to object
    log('\n=== Test 3: Testing the fix - array detection and conversion ===', 'info');
    
    function fixDataFormat(data) {
      let roomsData = data;
      
      if (Array.isArray(data)) {
        log('Detected array format, converting...', 'info');
        roomsData = {};
        data.forEach((room) => {
          if (room && room.id) {
            roomsData[room.id] = room;
          }
        });
      }
      
      return roomsData;
    }
    
    const fixedData = fixDataFormat(arrData);
    log(`Fixed data keys: ${Object.keys(fixedData)}`, 'info');
    assert(Object.keys(fixedData).includes('single'), 'Fixed data has correct room IDs');
    assert(fixedData.single.name === 'Single', 'Room data preserved correctly');

    // Test 4: Photo array validation
    log('\n=== Test 4: Photo array validation ===', 'info');
    
    const roomWithObjectPhotos = {
      id: 'test',
      photos: { 0: { url: 'a.jpg', order: 1 }, 1: { url: 'b.jpg', order: 2 } }
    };
    
    const roomWithArrayPhotos = {
      id: 'test',
      photos: [{ url: 'a.jpg', order: 1 }, { url: 'b.jpg', order: 2 }]
    };
    
    function normalizePhotos(room) {
      let photos = room.photos || [];
      if (!Array.isArray(photos)) {
        photos = Object.values(photos);
      }
      return { ...room, photos };
    }
    
    const normalizedObject = normalizePhotos(roomWithObjectPhotos);
    const normalizedArray = normalizePhotos(roomWithArrayPhotos);
    
    assert(Array.isArray(normalizedObject.photos), 'Object photos converted to array');
    assert(normalizedObject.photos.length === 2, 'Object photos array has correct length');
    assert(Array.isArray(normalizedArray.photos), 'Array photos remain as array');
    assert(normalizedArray.photos.length === 2, 'Array photos have correct length');

    // Test 5: Input validation for saveRooms
    log('\n=== Test 5: Input validation ===', 'info');
    
    function validateRoomsInput(rooms) {
      if (!Array.isArray(rooms)) {
        return { valid: false, error: 'Not an array' };
      }
      
      const invalidRooms = rooms.filter(room => !room.id || typeof room.id !== 'string');
      if (invalidRooms.length > 0) {
        return { valid: false, error: 'Invalid rooms found', invalidRooms };
      }
      
      return { valid: true };
    }
    
    const validInput = validateRoomsInput([{ id: 'single', name: 'Single' }]);
    const invalidInput1 = validateRoomsInput({ single: { name: 'Single' } });
    const invalidInput2 = validateRoomsInput([{ name: 'Single' }]); // missing id
    
    assert(validInput.valid === true, 'Valid input passes validation');
    assert(invalidInput1.valid === false, 'Object input fails validation');
    assert(invalidInput2.valid === false, 'Room without id fails validation');

    // Summary
    log('\n=== Test Summary ===', 'info');
    log(`Tests passed: ${testsPassed}`, 'pass');
    log(`Tests failed: ${testsFailed}`, testsFailed > 0 ? 'fail' : 'pass');
    log(`Total tests: ${testsPassed + testsFailed}`, 'info');
    
    if (testsFailed === 0) {
      log('\n✓ All tests passed! The bug fixes should work correctly.', 'pass');
    } else {
      log('\n✗ Some tests failed. Review the implementation.', 'fail');
    }
  </script>
</body>
</html>
